name: Build and release

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install lupa Pillow
      - name: Check release naming
        run: python tests/release_workflow.py
      - name: Test death module and Lua syntax
        run: python tests/run_deaths.py
      - name: Test preparation and alert controls
        run: python tests/run_preparation.py
      - name: Test equipped armor-kit recommendations
        run: python tests/run_armor_kits.py
      - name: Test talent-aware Hardcore gear advisor
        run: python tests/run_gear_advisor.py
      - name: Test auction upgrade scanning and native tabs
        run: python tests/run_auction_upgrades.py
      - name: Test Character window gear snapshots
        run: python tests/run_gear_snapshot.py
      - name: Test all Classic talent paths and advisor navigation
        run: python tests/run_talent_advisor.py
      - name: Stage shipping manifest
        id: release
        run: python scripts/prepare_ci_release.py
      - name: Build ZIP without publishing
        env:
          RELEASE_NAME: ${{ steps.release.outputs.name }}
        run: |
          python scripts/package_release.py --output .release
          python -c "import os, sys; from pathlib import Path; sys.path.insert(0, 'scripts'); from package_release import manifest; Path('.release/HardcoreBuddy-' + manifest()[0] + '.zip').rename(Path('.release') / (os.environ['RELEASE_NAME'] + '.zip'))"
      - name: Test packaged addon and media
        run: python tests/run_release.py ".release/${{ steps.release.outputs.name }}.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: HardcoreBuddy-build
          path: .release/${{ steps.release.outputs.name }}.zip
          if-no-files-found: error

  publish:
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check publishing credentials
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_PROJECT_ID: ${{ vars.CF_PROJECT_ID || secrets.CF_PROJECT_ID }}
        shell: bash
        run: |
          test -n "$CF_API_TOKEN" || { echo 'Missing CF_API_TOKEN secret'; exit 1; }
          [[ "$CF_PROJECT_ID" =~ ^[1-9][0-9]*$ ]] || { echo 'CF_PROJECT_ID must be a numeric project ID'; exit 1; }
      - name: Stage shipping manifest
        id: release
        run: python scripts/prepare_ci_release.py
      - name: Publish normal release with display label
        uses: BigWigsMods/packager@v2
        with:
          args: -c -o -e -l -u -p ${{ vars.CF_PROJECT_ID || secrets.CF_PROJECT_ID }} -n ${{ steps.release.outputs.name }}:${{ steps.release.outputs.name }}
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}
      - name: Set GitHub display title
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_NAME: ${{ steps.release.outputs.name }}
        shell: bash
        run: gh release edit "$RELEASE_TAG" --title "${RELEASE_NAME//-/ }" --prerelease=false
